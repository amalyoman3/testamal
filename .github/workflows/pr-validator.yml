name: PR Validator
on:
  pull_request_target:
    types: [opened, synchronize, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
      steps:
        - name: Check PR title
          run: |
            echo "Validating PR: ${{ github.event.pull_request.title }}"
            echo "Submitted by: ${{ github.event.pull_request.user.login }}"
